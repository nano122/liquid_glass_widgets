name: liquid_glass_widgets
description: "iOS 26-style liquid glass widgets for Flutter. Built on a custom fragment shader for real blur, liquid interactions, specular highlights, and chromatic aberration."
version: 1.3.0+poiesis.1

homepage: https://github.com/sdegenaar/liquid_glass_widgets
repository: https://github.com/nano122/liquid_glass_widgets
issue_tracker: https://github.com/nano122/liquid_glass_widgets/issues

topics:
  - liquid-glass
  - widgets
  - glassmorphism
  - flutter
  - apple

# Platform support declaration for pub.dev
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  shaders:
    - shaders/lightweight_glass.frag
    - shaders/interactive_indicator.frag
    - shaders/liquid_glass_geometry_blended.frag
    - shaders/liquid_glass_final_render.frag
    # 中文说明：Windows 原生 Impeller/OpenGLESSDF 不编译超椭圆 mode 2，
    # 其余 uniform 与合成逻辑必须和通用版本保持一致。
    - shaders/liquid_glass_final_render_windows.frag
    - shaders/progressive_blur.frag
